<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h3 id="heading">Downloading your video...</h3>
        <div id="spinner" class="spinner-border" role="status"></div>
        <p id="msg" class="text-danger mt-2"></p>
    </div>
    <script>
        const jobID = "{{ .JobID }}";

        async function poll() {
            const res = await fetch(`/status/${jobID}`);
            const data = await res.json();

            if (data.status === "done") {
                window.location.href = `/download/${jobID}`;
            } else if (data.status === "error") {
                document.getElementById("spinner").remove();
                document.getElementById("heading").textContent = "Download failed";
                document.getElementById("msg").textContent = data.error;
            } else {
                setTimeout(poll, 1500);
            }
        }

        poll();
    </script>
</body>
</html>
